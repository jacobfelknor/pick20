server {

    # server name must match the DNS name where this site is served in order to be
    # routed correctly
    # server_name pick20.example.com;
    server_name _;

    # Listen for connection on (internal to container) port 80
    # This NGINX config should only be used behind another one on
    # the server's host which configures SSL/domains/etc.
    listen 80;

    real_ip_header proxy_protocol;

    # 1. Frontend & SPA Routing
    location / {
        root /var/www/pick20/; # Use root instead of alias for the main block
        index index.html;
        try_files $uri $uri/ /index.html; 
    }

    # 2. Django Admin
    location /admin/ {
        proxy_pass http://pick20-backend:8000; # Use 8000 to match Gunicorn
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. API Paths
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Note: trailing slash on proxy_pass strips "/api/" from the request
        # sent to Django. If Django expects "/api/...", remove the trailing slash.
        # this and the container name for the fast api server need to match
        # the port and the container exposed port in the compose file must also match
        # do not change!
        proxy_pass http://pick20-backend:8000;
        
        proxy_redirect off;
        client_max_body_size 100M;
        proxy_buffering off;
    }

    # 4. Django Static Files (CSS, JS, Admin assets)
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 5. User Uploaded Media
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}